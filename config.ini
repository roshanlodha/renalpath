[Hyperparameters]
batch_size = 32
epochs = 50
learning_rate = 0.0001
weight_decay = 0.0001
patience = 5
num_workers = 0

# Small-data fine-tuning (recommended for ~300 images)
# Two-stage training: train head first, then unfreeze last backbone block(s)
loss = ce                # Options: ce, focal
label_smoothing = 0.1
head_lr = 0.001
backbone_lr = 0.00001
freeze_backbone_epochs = 5
unfreeze_last_n = 1
grad_clip_norm = 1.0
focal_gamma = 1.5

[Model]
model_type = gsvit # Options: resnet, vit, gsvit
gsvit_path = models/GSViT.pkl

# For resnet: pick a smaller backbone for tiny datasets
resnet_variant = 18

[Data]
data_dir = data
processed_dir = data/processed
metadata_csv = data/metadata.csv
upsample = True
train_test_split = 0.7
val_fraction = 0.2
binarization = ['Chromophobe' 'Clear_cell' 'Hybrid' 'Papillary']
