[Hyperparameters]
batch_size = 32
epochs = 50
learning_rate = 0.0001
weight_decay = 0.0001
patience = 5
num_workers = 0

[Model]
model_type = gsvit # Options: resnet, vit, gsvit
gsvit_path = models/GSViT.pkl

[Data]
data_dir = data
processed_dir = data/processed
metadata_csv = data/metadata.csv
upsample = True
train_test_split = 0.7
val_fraction = 0.2
binarization = ['Chromophobe' 'Clear_cell' 'Hybrid' 'Papillary']
