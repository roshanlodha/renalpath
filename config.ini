[Hyperparameters]
batch_size = 32
epochs = 50
learning_rate = 0.0001
weight_decay = 0.0001
patience = 10
num_workers = 4

[Model]
model_type = gsvit # Options: resnet, vit, gsvit
gsvit_path = models/GSViT.pkl

[Data]
data_dir = data
processed_dir = data/processed
metadata_csv = data/metadata.csv
upsample = True # upsample for balanced training
